# San Francisco event permit rules
# Converted from the nine Mermaid diagrams (00 overview .. 08 activity checks).
#
# ---------------------------------------------------------------------------
# HOW TO READ THIS FILE
# ---------------------------------------------------------------------------
# facts      Everything a rule can ask about an event, with the question to
#            ask the organizer. A fact left unanswered is "unknown".
# macros     Named, reusable conditions (e.g. "block_party_eligible").
# groups     Named sets of rules, used in `requires`.
# sections   Diagram grouping: a title and the `entry` condition that routes
#            an event into the section. Rules name one or more sections.
# sources    Citation registry. Rules point here by id.
# rules      One row per permit, plan, requirement, exemption or advisory.
# scenarios  Worked examples with the rule ids each one should trigger.
#
# CONDITION GRAMMAR (the `when` field; omitted = always applies)
#   {fact: <name>, op: <op>, value: <v>}   op: eq ne gt gte lt lte in not_in
#   {all: [<cond>, ...]}                    every condition true
#   {any: [<cond>, ...]}                    at least one true
#   {not: <cond>}
#   {macro: <name>}                         a condition from `macros`
#   {rule: <id>}                            true if that rule is in effect on
#                                           the as-of date and its `when` holds
#   Evaluate with three-valued logic: an unknown fact makes a condition
#   "undetermined" unless the rest of the expression already decides it.
#   Report undetermined rules as "may apply; answer <facts> to resolve".
#
# REQUIRES
#   `requires: [<rule id> | group:<name>]` means: every listed rule that
#   APPLIES to this event must be approved before this one. Listed rules
#   that don't apply are ignored. Topologically sort to get application order.
#
# DATES
#   effective_from / effective_to (inclusive, ISO dates; null = open-ended).
#   A rule outside its window is treated as not existing on the as-of date.
#
# CONFIDENCE
#   official        stated by the issuing agency or in code
#   official_scope  official source, but it was written for a narrower
#                   situation than the rule applies it to here
#   secondary       non-issuing source (another city, third-party site)
#   editorial       judgment call, no source says this directly
# ---------------------------------------------------------------------------

schema_version: 1
jurisdiction: City and County of San Francisco
researched_on: 2026-09-22
scope: >-
  Events in private or public spaces (block parties, street fairs, farmers
  markets, concerts, pop-ups, park events). Parades, marches/protests and film
  production are out of scope.

# ===========================================================================
# FACTS
# ===========================================================================
facts:
  # --- what and where -------------------------------------------------------
  event_type:
    type: enum
    values: [general, farmers_market, parade, march_or_protest, film_production]
    question: What kind of event is this?
  location:
    type: enum
    values:
      - private_residence       # home or yard
      - commercial_indoor       # store, gallery, venue, office
      - commercial_outdoor      # business patio, parking lot
      - street_or_sidewalk      # City right of way
      - city_park               # Rec and Park parks and plazas
      - port                    # piers, Embarcadero, Ferry Building
      - treasure_island         # Treasure Island or Yerba Buena Island
      - federal_nps             # GGNRA: Crissy Field, Ocean Beach, Lands End, Fort Mason
      - federal_presidio_trust  # Presidio Trust-managed areas
    question: Who controls the land where the event happens?
  indoors:
    type: bool
    question: Is the event inside a building? (Port and Treasure Island only)
  open_to_public:
    type: bool
    question: Is the event open to the general public or advertised publicly?
  sells_goods_or_services:
    type: bool
    question: Will anything be sold, including tickets, goods, or services?
  promotes_business:
    type: bool
    question: Is the event used to promote a business?
  zoning_matches_event_use:
    type: bool
    question: >-
      Does the property's Planning Code use match the event? (e.g. a comedy
      show in a vacant retail storefront does not match)
  peak_attendance:
    type: int
    question: What is the most people expected on site at one time?

  # --- streets ----------------------------------------------------------------
  closes_street:
    type: bool
    question: Will any part of the roadway be closed to traffic?
  recurring_closure:
    type: bool
    question: Will the street closure repeat weekly or monthly?
  blocks_closed:
    type: int
    question: How many blocks will be closed?
  closes_intersections:
    type: bool
    question: Does the closure include any intersection?
  affects_muni:
    type: bool
    question: Does the closure affect any Muni route?
  residential_street:
    type: bool
    question: Is it a residential street?
  host_is_block_resident:
    type: bool
    question: Is the host a resident of the block, or a resident association covering it?
  duration_hours:
    type: number
    question: How many hours long is the closure, including setup and cleanup?
  within_7am_10pm:
    type: bool
    question: Does the closure fall entirely between 7am and 10pm?
  in_entertainment_zone:
    type: bool
    question: Is the location inside a designated Entertainment Zone?
  ez_to_go_alcohol:
    type: bool
    question: Will nearby licensed bars sell drinks to-go into the zone during the event?

  # --- entertainment --------------------------------------------------------
  live_entertainment:
    type: bool
    question: Will there be live entertainment (band, DJ, comedy, dance, fashion show)?
  amplified_sound:
    type: bool
    question: Will there be amplified sound of any kind (speakers, PA, recorded music)?
  venue_has_poe_or_llp:
    type: bool
    question: Does the venue hold a Place of Entertainment or Limited Live Performance permit?
  within_venue_permitted_hours:
    type: bool
    question: Will the entertainment stay within the venue permit's approved hours?
  venue_approved_outdoor_entertainment:
    type: bool
    question: Is the premises already approved for outdoor entertainment under a POE or LLP permit?
  amplified_hours_per_day:
    type: number
    question: How many hours per day of outdoor amplified sound or entertainment?
  amplified_outside_9am_10pm:
    type: bool
    question: Will outdoor sound run before 9am or after 10pm?
  entertainment_days_per_year_at_location:
    type: int
    question: Including this event, how many days of entertainment at this location this calendar year?
  is_concert:
    type: bool
    question: Is the event a concert or musical performance?
  publicized_hours_ahead:
    type: number
    question: How many hours in advance will the concert be publicized?
  has_band:
    type: bool
    question: Will a band or orchestra perform?
  is_race:
    type: bool
    question: Is the event a race or marathon?
  race_participants:
    type: int
    question: How many race participants?
  swimmers:
    type: int
    question: How many swimmers, if any?

  # --- food and alcohol -------------------------------------------------------
  food_to_public:
    type: bool
    question: Will food or drink be sold or given away to the public?
  nonprofit_donated_food_only:
    type: bool
    question: Is the host a nonprofit serving only food donated by permitted food facilities?
  food_trucks:
    type: bool
    question: Will food trucks participate?
  farmers_market_operator:
    type: enum
    values: [certified_producer, nonprofit, government, other]
    question: Who operates the farmers market?
  alcohol_served:
    type: bool
    question: Will alcohol be served or sold?
  alcohol_free_of_charge:
    type: bool
    question: Is the alcohol free, with no charge, donation or door fee tied to it?
  free_admission:
    type: bool
    question: Is admission free?
  licensed_premises:
    type: bool
    question: Is the event at a restaurant, bar, winery or brewery?
  venue_serves_under_own_license:
    type: bool
    question: Will a licensed venue serve alcohol under its own existing license?

  # --- fire and structures ----------------------------------------------------
  tent_max_sqft:
    type: number
    question: What is the floor area of the largest tent or membrane structure (sq ft)?
  tent_occupant_load:
    type: int
    question: What is the largest occupant load of any tent?
  canopy_total_sqft:
    type: number
    question: What is the combined area of open-sided canopies (sq ft)?
  canopy_firebreaks_12ft:
    type: bool
    question: Are canopies separated by 12 ft fire breaks and kept 12 ft from structures and tents?
  cooking_fuel_or_open_flame:
    type: bool
    question: Will anyone cook or heat with propane, butane, charcoal, wood, open flame, or deep fryers?
  generator_gasoline_gal:
    type: number
    question: Largest portable generator gasoline capacity (gallons)?
  generator_diesel_gal:
    type: number
    question: Largest portable generator diesel capacity (gallons)?
  inflatables_flame_effects_or_flammable_liquids:
    type: bool
    question: Any air-inflated structures, flame effects, or flammable/combustible liquids?
  temporary_structures_or_construction:
    type: bool
    question: Any stages, bleachers, or construction/build-out of the space?
  venue_has_adequate_place_of_assembly:
    type: bool
    question: Does the venue already hold a Place of Assembly permit with enough occupant load?

# ===========================================================================
# MACROS
# ===========================================================================
macros:
  in_scope:
    fact: event_type
    op: not_in
    value: [parade, march_or_protest, film_production]

  city_land:
    all:
      - {macro: in_scope}
      - {fact: location, op: not_in, value: [federal_nps, federal_presidio_trust]}

  city_public_property:
    all:
      - {macro: in_scope}
      - {fact: location, op: in, value: [street_or_sidewalk, city_park, port, treasure_island]}

  indoor_setting:
    all:
      - {macro: in_scope}
      - any:
          - {fact: location, op: eq, value: commercial_indoor}
          - all:
              - {fact: location, op: in, value: [port, treasure_island]}
              - {fact: indoors, op: eq, value: true}

  outdoor_setting:
    all:
      - {macro: in_scope}
      - any:
          - {fact: location, op: in, value: [commercial_outdoor, street_or_sidewalk]}
          - all:
              - {fact: location, op: in, value: [port, treasure_island]}
              - {fact: indoors, op: eq, value: false}

  one_time_street_closure:
    all:
      - {macro: in_scope}
      - {fact: location, op: eq, value: street_or_sidewalk}
      - {fact: closes_street, op: eq, value: true}
      - {fact: recurring_closure, op: eq, value: false}

  block_party_eligible:
    all:
      - {macro: one_time_street_closure}
      - {fact: host_is_block_resident, op: eq, value: true}
      - {fact: blocks_closed, op: eq, value: 1}
      - {fact: residential_street, op: eq, value: true}
      - {fact: affects_muni, op: eq, value: false}
      - {fact: sells_goods_or_services, op: eq, value: false}
      - {fact: promotes_business, op: eq, value: false}
      - {fact: duration_hours, op: lte, value: 8}
      - {fact: within_7am_10pm, op: eq, value: true}

  admin_review_eligible:
    all:
      - {fact: blocks_closed, op: lte, value: 3}
      - {fact: closes_intersections, op: eq, value: false}
      - {fact: affects_muni, op: eq, value: false}

  park_code_7_03_trigger:
    any:
      - {fact: peak_attendance, op: gte, value: 25}
      - {fact: amplified_sound, op: eq, value: true}
      - {fact: food_to_public, op: eq, value: true}
      - all:
          - {fact: is_concert, op: eq, value: true}
          - any:
              - {fact: publicized_hours_ahead, op: gte, value: 4}
              - {fact: has_band, op: eq, value: true}
      - all:
          - {fact: is_race, op: eq, value: true}
          - {fact: race_participants, op: gte, value: 25}

  ec_outdoor_extended:
    any:
      - {fact: amplified_hours_per_day, op: gt, value: 6}
      - {fact: amplified_outside_9am_10pm, op: eq, value: true}
      - {fact: entertainment_days_per_year_at_location, op: gt, value: 12}

# ===========================================================================
# GROUPS
# ===========================================================================
groups:
  # Permission to use the land. Other City permits need this first.
  property_permission:
    - owner_permission
    - planning_temporary_use_authorization
    - dpw_sidewalk_occupancy
    - shared_spaces_permit
    - sfmta_block_party_closure
    - sfmta_special_event_closure
    - rpd_special_event_permit
    - port_special_event_license
    - tida_use_permit

# ===========================================================================
# SECTIONS
# One diagram each. `entry` is the condition that routes an event into the
# section on the overview diagram; a rule's own `when` still decides whether
# it applies. Section 00 is the overview itself and has no entry.
# ===========================================================================
sections:
  "00":
    title: Overview
  "01":
    title: Private residence
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: private_residence}
  "02":
    title: Private commercial property
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: in, value: [commercial_indoor, commercial_outdoor]}
  "03":
    title: Private commercial outdoor space
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: commercial_outdoor}
  "04":
    title: Street or sidewalk
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: street_or_sidewalk}
  "05":
    title: City park
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
  "06":
    title: Port and Treasure Island
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: in, value: [port, treasure_island]}
  "07":
    title: Federal land
    entry:
      all:
        - {macro: in_scope}
        - {fact: location, op: in, value: [federal_nps, federal_presidio_trust]}
  "08a":
    title: Food and drink
    entry: {macro: in_scope}
  "08b":
    title: Alcohol
    entry: {macro: in_scope}
  "08c":
    title: Fire and structures
    entry: {macro: city_land}
  "08d":
    title: Crowd size
    entry: {macro: city_land}

