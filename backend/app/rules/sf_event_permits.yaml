  - id: nps_special_park_use_permit
    section: "07"
    kind: permit
    agency: National Park Service (GGNRA)
    title: Special Park Use Permit
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: federal_nps}
