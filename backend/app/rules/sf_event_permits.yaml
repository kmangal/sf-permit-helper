# ===========================================================================
# RULES
# section = id (or list of ids) from `sections`; mostly the former Mermaid
# diagram (00-08) the rule came from, with 08 split into 08a-08d
# ===========================================================================
rules:

  # ---------------------------------------------------------------- 00 overview
  - id: out_of_scope_event_type
    section: "00"
    kind: out_of_scope
    title: Parades, marches/protests and film shoots use separate processes
    when: {not: {macro: in_scope}}
    notes: >-
      Parades and marches start with the SFPD district station. Film
      production needs a film permit (Rec and Park permit if filming in a park).
    sources: [sfgov_event_topic]
    confidence: official

  - id: permitsf_intake
    section: "00"
    kind: advisory
    title: Submit the PermitSF pre-application intake form
    when: {macro: city_land}
    notes: >-
      Staff review within about 2 business days and return a personalized
      checklist of permits and the order to apply. Help:
      SpecialEventSF@sfgov.org, 628-652-4949.
    sources: [sfgov_check_permits, sfgov_event_topic]
    confidence: official

  - id: written_final_approval
    section: "00"
    kind: advisory
    title: Have written final approval from every agency before the event
    when: {macro: in_scope}
    notes: >-
      Incomplete applications are neither approved nor denied and cannot be
      appealed; the process is complete only on written final approval.
    sources: [sfgov_event_topic]
    confidence: official

  # ------------------------------------------------------- 01 private residence
  - id: residence_private_no_city_permit
    section: "01"
    kind: exemption
    title: Private party at a home generally needs no City event permit
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: private_residence}
        - {fact: open_to_public, op: eq, value: false}
        - {fact: sells_goods_or_services, op: eq, value: false}
        - {fact: closes_street, op: eq, value: false}
    notes: >-
      EC entertainment permits exclude private residences (indoor and
      outdoor). DPH temporary food permits are not needed for private parties.
      Fire rules for tents, cooking and generators still apply (see 08).
    sources: [ec_indoor, ec_outdoor, dph_organize_vendors]
    confidence: official

  - id: residence_public_confirm_zoning
    section: "01"
    kind: advisory
    title: Confirm with Planning that a public or commercial event is allowed at the home
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: private_residence}
        - any:
            - {fact: open_to_public, op: eq, value: true}
            - {fact: sells_goods_or_services, op: eq, value: true}
    sources: []
    confidence: editorial

  - id: noise_limits
    section: "00"
    kind: requirement
    title: Follow City noise limits (Police Code Art. 29, Regulation of Noise)
    when: {macro: city_land}
    sources: [ec_rules]
    confidence: official

  # -------------------------------------------- 02/03 private commercial property
  - id: owner_permission
    section: "02"
    kind: document
    title: Written permission from the property owner or manager
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: in, value: [commercial_indoor, commercial_outdoor]}
    notes: >-
      A letter or rental contract. If you are the owner or manager, you
      confirm that on each application instead.
    sources: [ec_indoor, ec_outdoor, osb_popups]
    confidence: official

  - id: planning_temporary_use_authorization
    section: "02"
    kind: permit
    agency: Planning Department
    title: Temporary Use Authorization
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: in, value: [commercial_indoor, commercial_outdoor]}
        - {fact: zoning_matches_event_use, op: eq, value: false}
    requires: [owner_permission]
    notes: >-
      The property owner, or the host acting as the owner's agent, applies.
      Valid 1 day to 2 years; pop-up retail limited to 60 days. The OSB guide
      describes this for commercial spaces; applying it to outdoor commercial
      lots is an extension.
    sources: [osb_popups]
    confidence: official_scope

  - id: sffd_place_of_assembly
    section: ["02", "06"]
    kind: permit
    agency: SF Fire Department
    title: Place of Assembly Permit (temporary or permanent)
    when:
      all:
        - {macro: indoor_setting}
        - {fact: peak_attendance, op: gte, value: 50}
        - {fact: venue_has_adequate_place_of_assembly, op: eq, value: false}
    requires: [group:property_permission]
    notes: >-
      Apply in person at the Permit Center, 49 South Van Ness. A Fire Watch
      may be required. Check whether the venue's existing permit covers your
      occupant load.
    sources: [ec_indoor, osb_popups]
    confidence: official

  - id: ec_one_time_indoor
    section: ["02", "06"]
    kind: permit
    agency: Entertainment Commission
    title: One Time Indoor Entertainment Permit
    when:
      all:
        - {macro: indoor_setting}
        - {fact: live_entertainment, op: eq, value: true}
        - not:
            all:
              - {fact: venue_has_poe_or_llp, op: eq, value: true}
              - {fact: within_venue_permitted_hours, op: eq, value: true}
    requires:
      - group:property_permission
      - sffd_place_of_assembly
      - dph_temporary_food_facility
      - abc_daily_license
    fee: {amount_usd: 573, amendment_usd: 394, as_of: 2026-09}
    lead_time: {min_days: 14, unit: calendar, hard_floor_days: 7}
    limits: Max 12 days of entertainment per premises per calendar year.
    notes: >-
      Not needed for amplified sound only (recorded music, speeches, film).
      EC needs copies of any required Fire and Health permits. EC may deny
      applications filed under 7 days before the event.
    sources: [ec_indoor]
    confidence: official

  # ------------------------------------------------------ 04 street or sidewalk
  - id: dpw_sidewalk_occupancy
    section: "04"
    kind: permit
    agency: SF Public Works
    title: Temporary sidewalk occupancy permit (or existing Cafe Tables and Chairs / Shared Spaces parklet permit)
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: street_or_sidewalk}
        - {fact: closes_street, op: eq, value: false}
    sources: [ec_outdoor, osb_popups]
    confidence: official

  - id: shared_spaces_permit
    section: "04"
    kind: permit
    agency: SFMTA / Shared Spaces
    title: Shared Spaces Permit for a recurring street closure
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: street_or_sidewalk}
        - {fact: closes_street, op: eq, value: true}
        - {fact: recurring_closure, op: eq, value: true}
    sources: [sfgov_street_guide, sfmta_special_event_closures]
    confidence: official

  - id: sfmta_block_party_closure
    section: "04"
    kind: permit
    agency: SFMTA
    title: Neighborhood Block Party Street Closure
    when: {macro: block_party_eligible}
    fee: {amount_usd_from: 343, as_of: 2026-09, note: Rate depends on how far in advance you apply}
    lead_time: {min_days: 30, unit: calendar}
    notes: >-
      No sales or business promotion. Bounce houses may not fit narrow
      streets; they cannot block the emergency access lane. SFMTA discourages
      No Parking signs for most block parties.
    sources: [sfmta_block_party, sfmta_special_event_closures, sfgov_fees]
    confidence: official

  - id: sfmta_special_event_closure
    section: "04"
    kind: permit
    agency: SFMTA (ISCOTT)
    title: Special Event Street Closure
    when:
      all:
        - {macro: one_time_street_closure}
        - {not: {macro: block_party_eligible}}
    lead_time:
      min_days: 30
      unit: calendar
      overrides:
        - when: {fact: sells_goods_or_services, op: eq, value: true}
          min_days: 90
          note: Street fair applications are due 90+ days ahead
    notes: >-
      Needs a scaled site plan. Do not contact other departments about
      permits until the street closure is approved; the ISCOTT process then
      guides you through the rest. Larger events may need waste, staffing,
      security and medical plans.
    sources: [sfgov_street_guide, sfmta_special_event_closures]
    confidence: official

  - id: iscott_administrative_review
    section: "04"
    kind: process_step
    part_of: sfmta_special_event_closure
    title: Administrative review, no public hearing
    when:
      all:
        - {rule: sfmta_special_event_closure}
        - {macro: admin_review_eligible}
    effective_from: 2026-05-21
    verify: >-
      2026-05-21 is when the Mayor signed the ordinance (the Board passed it
      2026-05-12). The ordinance's operative date was not confirmed.
    sources: [mayor_2026_ordinance]
    confidence: official

  - id: iscott_public_hearing
    section: "04"
    kind: process_step
    part_of: sfmta_special_event_closure
    title: ISCOTT public hearing
    when:
      all:
        - {rule: sfmta_special_event_closure}
        - {not: {rule: iscott_administrative_review}}
    notes: >-
      Post public notices about 10 days before the hearing; permit arrives
      about 7-10 days after. Before the 2026 ordinance took effect, every
      special event closure needed a hearing; that falls out of this rule
      automatically because administrative review isn't in effect then.
    sources: [sfgov_street_guide, sfmta_special_event_closures, mayor_2026_ordinance]
    confidence: official

  - id: sfpd_street_fair_staffing
    section: "04"
    kind: requirement
    agency: SF Police Department
    title: Police staffing may be required for street fairs (Transportation Code 6.6)
    when:
      all:
        - {rule: sfmta_special_event_closure}
        - {fact: sells_goods_or_services, op: eq, value: true}
    fee:
      note: >-
        Without alcohol, organizers pay 40% of projected SFPD costs, capped at
        $2,793.49 (rates effective January 2026).
    sources: [sfgov_fees]
    confidence: official

  - id: entertainment_zone_event
    section: "04"
    kind: permit
    agency: OEWD Entertainment Zone program
    title: Entertainment Zone one-day event permit (for each day)
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: street_or_sidewalk}
        - {fact: in_entertainment_zone, op: eq, value: true}
        - {fact: ez_to_go_alcohol, op: eq, value: true}
    requires: [group:property_permission]
    notes: >-
      Follow the zone's Management Plan and contact its point person. Zones
      are active only during ABC-permitted special events.
    sources: [sfgov_entertainment_zone, sfgov_event_topic]
    confidence: official

  - id: ec_one_time_outdoor
    section: ["03", "04", "06"]
    kind: permit
    agency: Entertainment Commission
    title: One Time Outdoor Event Permit
    when:
      all:
        - {macro: outdoor_setting}
        - any:
            - {fact: live_entertainment, op: eq, value: true}
            - {fact: amplified_sound, op: eq, value: true}
        - {fact: venue_approved_outdoor_entertainment, op: ne, value: true}
    requires: [group:property_permission]
    fee:
      amount_usd: 573
      amendment_usd: 394
      as_of: 2026-09
      note: >-
        Pick the "Outdoor Entertainment" fee for live performers, or the
        "Outdoor Amplified Sound" fee for sound with no performer, not both.
    lead_time:
      min_days: 14
      unit: calendar
      hard_floor_days: 7
      overrides:
        - when: {macro: ec_outdoor_extended}
          min_days: 45
          note: Over 6 hrs/day, outside 9am-10pm, or 13+ days; a hearing may be required
    limits: >-
      Max 6 hours per day, 9am to 10pm; up to 12 days per calendar year per
      location unless the Commission approves more.
    notes: >-
      Covers streets, sidewalks and private commercial property. Not for
      residential, Rec and Park, state or federal property, or buskers.
      Conflict: the OSB pop-up guide says up to 23 one-time outdoor events per
      year; this file follows the EC's own 12-day figure.
    sources: [ec_outdoor, osb_popups]
    confidence: official

  # ---------------------------------------------------------------- 05 city park
  - id: rpd_special_event_permit
    section: "05"
    kind: permit
    agency: Recreation and Park Department
    title: Rec and Park Special Event Permit
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {macro: park_code_7_03_trigger}
    notes: >-
      Park Code 7.03 triggers: gathering of 25+ people; concert publicized 4+
      hours ahead, amplified, or with a band; selling or providing food
      (beyond a picnic of 25 or fewer); race with 25+ participants; any
      amplified sound. No EC permit is needed on RPD property. Cancellation
      forfeits 25% of facility fees after invoicing, all fees within 30 days.
    sources: [park_code_7_03, rpd_special_events, ec_outdoor]
    confidence: official

  - id: rpd_amplified_sound_application
    section: "05"
    kind: permit
    agency: Recreation and Park Department
    title: Amplified Sound Application
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {fact: amplified_sound, op: eq, value: true}
    notes: Day and hour limits vary by venue.
    sources: [rpd_special_events, rpd_other_provisions]
    confidence: official

  - id: rpd_no_event_permit
    section: "05"
    kind: exemption
    title: No park special event permit; reserve the picnic area, field or facility if the site requires it
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {not: {macro: park_code_7_03_trigger}}
    sources: [park_code_7_03]
    confidence: official

  - id: rpd_fenced_beer_garden
    section: "05"
    kind: requirement
    title: Alcohol only inside a fenced beer garden; no glass or cans; precinct police review
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {fact: alcohol_served, op: eq, value: true}
    sources: [rpd_other_provisions]
    confidence: official

  - id: rpd_ada_forms
    section: "05"
    kind: requirement
    title: ADA forms for events of 1,000+ participants
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {fact: peak_attendance, op: gte, value: 1000}
    sources: [rpd_other_provisions]
    confidence: official

  - id: rpd_transportation_plan
    section: "05"
    kind: plan
    title: Transportation plan for events drawing 5,000+
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: city_park}
        - {fact: peak_attendance, op: gte, value: 5000}
