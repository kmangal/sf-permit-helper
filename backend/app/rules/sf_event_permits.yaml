    notes: Trucks without an SF mobile food facility permit pay an extra fee.
    sources: [dph_food_guide, osb_popups]
    confidence: official

  # ------------------------------------------------------------- 08 alcohol
  - id: abc_license_not_required
    section: "08b"
    kind: exemption
    title: No ABC license for a private, free event with free alcohol
    when:
      all:
        - {macro: in_scope}
        - {fact: alcohol_served, op: eq, value: true}
        - {fact: open_to_public, op: eq, value: false}
        - {fact: free_admission, op: eq, value: true}
        - {fact: alcohol_free_of_charge, op: eq, value: true}
        - {fact: licensed_premises, op: eq, value: false}
    notes: California Business and Professions Code 23399.1.
    sources: [san_rafael_abc]
    confidence: secondary

  - id: abc_daily_license
    section: "08b"
    kind: license
    agency: California Department of Alcoholic Beverage Control
    title: One-day ABC license (Form ABC-221 or authorization)
    when:
      all:
        - {macro: city_land}
        - {fact: alcohol_served, op: eq, value: true}
        - {fact: venue_serves_under_own_license, op: ne, value: true}
        - {not: {rule: abc_license_not_required}}
    requires: [group:property_permission, sfpd_alcohol_approval]
    lead_time: {min_days: 10, max_days: 30, unit: calendar}
    notes: >-
      Daily Special: nonprofits serving beer and wine. Daily General:
      charitable, civic or religious groups, including spirits. Catering
      Authorization: hire a caterer with its own license. Event Authorization:
      a bar or restaurant serving on nearby property. Property owner
      authorization required. Federal land is excluded here only because
      diagram 07 defers to the land manager; state ABC law may still apply.
    sources: [abc_221, sfgov_outdoor_alcohol, ec_indoor]
    confidence: official

  - id: sfpd_alcohol_approval
    section: "08b"
    kind: permit
    agency: SF Police Department (district station)
    title: Police district station approval of the liquor license
    when: {rule: abc_daily_license}
    requires: [group:property_permission, security_plan]
    lead_time:
      unit: calendar
      overrides:
        - when: {macro: outdoor_setting}
          min_days: 90
          note: Outdoor events submit the liquor application and security plan to SFPD 3+ months ahead
    notes: SFPD or ABC may add conditions, including security requirements.
    sources: [sfgov_outdoor_alcohol, abc_221, osb_popups]
    confidence: official

