    confidence: official

  - id: dph_temporary_food_facility
    section: "08a"
    kind: permit
    agency: SF Department of Public Health
    title: Temporary Food Facility permits (organizer + every vendor)
    when:
      all:
        - {macro: city_land}
        - {fact: food_to_public, op: eq, value: true}
        - {fact: event_type, op: ne, value: farmers_market}
