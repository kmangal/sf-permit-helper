    when:
      all:
        - {macro: city_land}
        - {fact: event_type, op: eq, value: farmers_market}
    requires: [group:property_permission, cdfa_certified_farmers_market_certificate]
    lead_time: {note: "Renew each quarter; submit documents 14+ days before the quarter"}
    notes: >-
      Submit a vendor list, site map with each vendor and restroom, restroom
      verification form, and SF Business Registration Certificate.
    sources: [dph_cfm]
    confidence: official

  - id: cdfa_certified_farmers_market_certificate
    section: "08a"
    kind: permit
    agency: California Department of Food and Agriculture
    title: State Certified Farmers' Market certificate
    when:
      all:
        - {macro: city_land}
        - {fact: event_type, op: eq, value: farmers_market}
    notes: Include a map marking agricultural vs non-agricultural vendors.
    sources: [dph_cfm]
    confidence: official

  - id: farmers_market_operator_ineligible
    section: "08a"
    kind: blocker
    title: A certified farmers market may only be operated by certified producers, a nonprofit, or a government agency
    when:
      all:
        - {macro: in_scope}
        - {fact: event_type, op: eq, value: farmers_market}
        - {fact: farmers_market_operator, op: eq, value: other}
