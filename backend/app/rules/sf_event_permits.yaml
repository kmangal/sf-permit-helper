    confidence: official

  - id: tida_use_permit
    section: "06"
    kind: permit
    agency: Treasure Island Development Authority
    title: TIDA Use Permit
    when:
      all:
        - {macro: in_scope}
        - {fact: location, op: eq, value: treasure_island}
