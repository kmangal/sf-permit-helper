[project]
name = "sf-permit-helper"
version = "0.1.0"
description = "Helps people identify permits they need for tasks in San Francisco"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "anthropic",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
    "pydantic-settings>=2.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
