[project]
name = "sf-permit-helper"
version = "0.1.0"
description = "Helps people identify permits they need for tasks in San Francisco"
requires-python = "==3.13.1"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pyyaml==6.0.3",
    "typesafe-sdk==0.7.1",
    "pydantic-settings==2.15.0",
    "openrouter==1.2.22",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "commitizen==4.19.0",
    "import-linter==2.15",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "ty==0.0.83",
]
